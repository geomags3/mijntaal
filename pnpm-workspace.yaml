# This standalone workspace contains only the application at its root.
packages:
  - .

# Copied Sites cannot inherit a parent monorepo policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  sharp: 0.35.5
  '@babel/core': 7.29.6
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  source-map-js: 1.2.2
  fast-uri: 3.1.9
  ws: 8.21.0
  undici: 7.30.1
  js-yaml: 4.3.2
  image-size: 2.0.3
  zod: 4.6.7
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'esbuild@>=0.18.0 <0.25.0': 0.25.12
  'esbuild@>=0.27.0 <0.28.1': 0.28.1
# Reviewed security patch; all other packages retain the seven-day release delay.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9
